<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Kanban Board</h1>
    </header>
    <div class="container">
        <main>
            <div class="add-task">
                <input id="task-input" type="text" placeholder="Enter a task....">
                <button class="add">Add task</button>
            </div>
            <section class="board">
                <div class="column todo">
                    <h2>To Do</h2>
                    <div class="task-list">

                    </div>
                </div>
                <div class="column doing">
                    <h2>Doing</h2>
                    <div class="task-list">
                        
                    </div>
                </div>
                <div class="column done">
                    <h2>Done</h2>
                    <div class="task-list">
                        
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
<script src="script.js"></script>
</html>
